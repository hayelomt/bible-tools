<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamp</title>
    <meta name="description" content="Sermon and Bible study notes, on your device and offline." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f3e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110c09" media="(prefers-color-scheme: dark)" />
    <script>
      // Applies the saved colour mode before the first paint (TECH-DESIGN §8.5). Mirrors
      // readMode, resolveMode and applyMode in @lamp/ui/themes/theme; keep them in step.
      (function () {
        var mode;
        try {
          mode = (JSON.parse(localStorage.getItem('lamp.theme') || '{}') || {}).mode;
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- The shell's frame (AppShell), with its classes, drawn before the app's script has run so
           the start is never a blank page. React replaces it with its first render. -->
      <div class="min-h-svh lg:flex" aria-hidden="true">
        <aside
          data-slot="sidebar"
          class="sticky top-0 hidden h-svh w-60 shrink-0 flex-col gap-6 border-r bg-card p-4 lg:flex"
        ></aside>
        <header
          data-slot="screen-header"
          class="sticky top-0 z-10 flex h-14 items-center gap-2 border-b bg-background px-4 lg:hidden"
        ></header>
        <nav
          data-slot="bottom-nav"
          class="fixed inset-x-0 bottom-0 z-10 border-t bg-background pb-[env(safe-area-inset-bottom)] lg:hidden"
        >
          <ul class="grid h-14 grid-cols-5"></ul>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
