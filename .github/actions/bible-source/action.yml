name: Bible source texts
description: Restores packages/bible-data/source from the cache, downloading it on a miss (TECH-DESIGN §9).
runs:
  using: composite
  steps:
    # The key follows the pinned checksums, so a new source zip means a new cache entry.
    - uses: actions/cache@v4
      with:
        path: packages/bible-data/source
        key: bible-source-${{ hashFiles('packages/bible-data/src/sources.ts') }}
    - name: Download source texts if missing
      shell: bash
      run: pnpm --filter @lamp/bible-data download
