name: Idea
description: Suggest a feature or a change.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: >-
        How it could work. The PRD (docs/) lists what's planned for phase 1 and phase 2; say if
        this changes either.
